<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RACOMA · 動畫效果展示</title>
  <style>
    @font-face{font-family:"IBM Plex Sans";src:url("assets/fonts/ibm-plex-sans-400.ttf") format("truetype");font-weight:400;font-display:swap}
    @font-face{font-family:"Rufina";src:url("assets/fonts/rufina-400.ttf") format("truetype");font-weight:400;font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#f7f6f3;color:#513c36;font-family:"IBM Plex Sans","Microsoft JhengHei",sans-serif}
    main{width:min(760px,100%);padding:56px 24px}
    header{text-align:center;margin-bottom:40px}
    .logo{display:block;width:120px;height:auto;margin:0 auto 24px}
    h1{margin:0;font-size:24px;font-weight:400;letter-spacing:2px}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .version{display:flex;align-items:center;gap:24px;min-height:132px;padding:24px 28px;border:1px solid #c9bdaf;border-radius:2px;color:inherit;text-decoration:none;background:transparent;transition:background-color .2s,border-color .2s}
    .letter{font:400 48px/1 "Rufina",serif}
    .name{display:block;font-size:18px;line-height:1.5}
    .description{display:block;margin-top:6px;color:#77665e;font-size:13px;line-height:1.5}
    .version:hover{background:#eeeae3;border-color:#513c36}
    .version:focus-visible{outline:2px solid #513c36;outline-offset:5px}
    @media(max-width:520px){main{padding:40px 24px}header{margin-bottom:28px}nav{grid-template-columns:1fr;gap:12px}.version{min-height:104px;padding:20px 24px}.letter{font-size:40px}}
    @media(prefers-reduced-motion:reduce){.version{transition:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="assets/logo-dark.svg" alt="RACOMA">
      <h1>動畫效果展示</h1>
    </header>
    <nav aria-label="動畫版本">
      <a class="version" href="animation-a.html"><span class="letter">A</span><span><span class="name">柔和浮現</span><span class="description">原位淡入，依閱讀順序浮現</span></span></a>
      <a class="version" href="animation-b.html"><span class="letter">B</span><span><span class="name">編輯式揭幕</span><span class="description">圖片揭露，文字依序入場</span></span></a>
      <a class="version" href="animation-c.html"><span class="letter">C</span><span><span class="name">緩慢呼吸</span><span class="description">緩慢縮放，低幅度移動</span></span></a>
      <a class="version" href="animation-d.html"><span class="letter">D</span><span><span class="name">空間層次</span><span class="description">固定背景，捲動視差</span></span></a>
    </nav>
  </main>
</body>
</html>
